# 配图引擎：黑白针管笔（pen-line）
# 2026-10-12 从原 06-crt.yaml 拆出——那份内容本来是针管笔，只是文件名挂错了 crt，
# 现按实际内容改名，crt 那个名字还给真正的 CRT 界面引擎。
# 炼化自 andiii-wechat-workflow/skills/andiii-crt-style（MIT）
name: "pen-line"

description: "黑白针管笔线稿风：细腻线条、疏密对比、无彩色，适合文艺/深度/黑白摄影感文章，也是「纽约客编辑风」主题的配图搭子"

color:
  base: "纯白纸底，黑白灰阶，无彩色"
  accents: ["无（纯黑白）"]
  ink: "针管笔墨（细线深黑 #1a1a1a），灰阶层次"
  forbidden: ["color", "saturated", "watercolor", "pastel", "gradient", "3D render", "neon", "photo"]

texture:
  paper: ["smooth white paper", "fine art paper"]
  effects: ["fine pen lines", "hatching", "cross-hatching", "stippling", "line weight variation", "dense linework"]

typography:
  default: "无文字"
  max_title: "10字（仅用户要求时，手写细线字）"
  font: "handwritten thin-line"

layout:
  hard: ["彩色", "水彩晕染", "高饱和", "渐变", "3D", "霓虹", "照片写实", "商业插画", "可爱卡通"]
  soft: ["thick brush strokes", "messy scribble", "color blocks"]

# ── 视觉锚（可选）──
# 本引擎的风格锚图，路径相对 examples/image-engines/anchors/。
# 默认空：没有锚图就走纯文字 prompt；挑选与登记方法见该目录 README。
anchor_images: []
