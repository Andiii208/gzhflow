# gzhflow 排版主题路由表配置模板
# 用法：复制为 config/themes.yaml。排版阶段（⑤）据话题选主题，再按组件库装配。

# default_theme: 匹配不到任何关键词时的兜底主题
default_theme: "zen"

# 主题的权威定义在 skills/gzh-design/references/theme-index.md（单一来源）：
#   - skills/gzh-design/references/theme-{标识}.md = 组件库（手工装配用，含引言卡/章节卡/签名区等完整组件）
#   - examples/themes/*.yaml = 同色值的轻量主题（scripts/md2wechat.py 自动渲染用）
# 两边色值必须一致。改主题先改 theme-index.md，再同步 yaml（2026-10-12 补齐到 10 套）。
routing:
  - topic_keywords: ["教程", "清单", "盘点", "干货", "工具", "知识"]
    theme: "moyu-green"        # 摸鱼绿：卡片丰富、信息密度高，默认推荐
  - topic_keywords: ["观点", "深度", "分析", "思考", "力量感"]
    theme: "red-white"         # 红白：经典编辑风，编号章节 + 引言卡 + 签名区
  - topic_keywords: ["思辨", "评论", "争鸣", "随笔", "专栏"]
    theme: "newyorker-editorial"  # 纽约客编辑风：衬线标题 + 单色砖橙 + 细线 + 大留白
  - topic_keywords: ["科技", "设计", "专业", "评论", "品牌"]
    theme: "graphite-minimal"  # 石墨极简：全灰阶，留白理性
  - topic_keywords: ["产品", "设计感", "技术解读", "冷静", "理性叙事"]
    theme: "mist-blue"         # 雾蓝：浅雾蓝底，主题库唯一冷色系
  - topic_keywords: ["数码", "效率", "工具体验", "上手", "体验"]
    theme: "sspai"             # 少数派：暖白底 + 砖红点缀
  - topic_keywords: ["日常", "随笔", "生活", "情感", "禅意", "冥想"]
    theme: "zen"               # 留白禅意：呼吸感最强
  - topic_keywords: ["测评", "对比", "评测", "创意"]
    theme: "moyu-ticket"       # 摸鱼票据：票据视觉隐喻，星级评分 + 硬阴影卡片
  - topic_keywords: ["内刊", "案例", "复盘", "说明文档", "系统"]
    theme: "olive-journal"     # 橄榄手记：编辑部内刊质感，信息密度偏高

# 用户指定主题时直接用指定值；无指定时按上表匹配，全自动模式自动选并说明理由。
