# gzhflow 工作流配置模板
# 用法：复制为 config/workflow.yaml 后按需修改。所有键都有默认值，可只改需要的部分。

# ── 六阶段开关 ──
# 设为 false 可跳过该阶段（如不想配图，把 illustration 设为 false）
stages:
  material: true      # ① 素材先行
  writing: true       # ② 写作
  deai: true          # ③ 去 AI 味
  illustration: false # ④ 配图（默认关闭，需图生后端，配好再开）
  layout: true        # ⑤ 排版
  publish: true       # ⑥ 推草稿箱

# ── 审核模式 ──
# strict: 每阶段输出都给用户审阅后才进入下一阶段（默认，最稳）
# auto:   用户说"直接做/不用审阅"时全自动跳过审阅
review_mode: strict

# ── 输出目录 ──
output_dir: generated

# ── 作者署名（写入文章 frontmatter 与签名区）──
author: "你的公众号名"        # 改为你自己的公众号名
signature: "—— {author}"      # 签名格式，{author} 会被替换

# ── 图生后端（多后端：按名字切换，默认用 default 指定的那个）──
# 每个后端都是 OpenAI 兼容接口；想换服务商只改这里，流程不动。
# 额外字段：
#   price            每张单价（美元），0 = 免费；仅用于预算预估
#   strict_sizes     true = 尺寸须两条边对齐 16 的倍数、宽高比 <3:1、像素 0.66M–8.3M（gpt-image-2）
#   supports_quality true = 支持 low/medium/high 质量档（影响速度与成本）
image_backends:
  default: dashscope
  dashscope:
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "wanx2.1-t2i-turbo"
    api_key_env: "IMAGE_API_KEY"
  agnes:                                  # 免费后端，适合构图试错
    base_url: "https://apihub.agnes-ai.com/v1"
    model: "agnes-image-2.1-flash"
    api_key_env: "AGNES_API_KEY"
    price: 0
  gpt-image-2:                            # 付费主力：质量档 + 参考图（锚图）
    base_url: "https://api.openai.com/v1"
    model: "gpt-image-2"
    api_key_env: "OPENAI_API_KEY"
    strict_sizes: true
    supports_quality: true
    # price_table: {low: 0.006, medium: 0.053, high: 0.211}   # 想覆盖内置价目表时打开

# ── 生图预算（阶段④用 scripts/image_batch.py 执行）──
# 管的是生成纪律：清单之外不生成、超限先砍次要图。想加金句卡等品类，加进 manifest 即可。
image_budget:
  max_images: 4            # 每次 Run 的张数上限（0 = 不限）
  max_cost_usd: 0.30       # 每次 Run 的金额上限（美元，0 = 不限）
  parallel: 4              # 并行生成路数
  retry: 1                 # 每张失败重试次数（指数退避）
  quality_cover: high      # 封面档（钱花在这）
  quality_inline: medium   # 内文档
  quality_draft: low       # 试稿/金句卡档（选构图用）

# ── 图生后端（旧版单后端写法，保留兼容）──
# 配置了上面的 image_backends 时本段被忽略；只配这一段也能跑（等价于只有一个默认后端）。
image_backend:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # 改为你的服务商
  model: "wanx2.1-t2i-turbo"      # 模型名按服务商文档填
  api_key_env: "IMAGE_API_KEY"    # 读哪个环境变量的 API Key（本地 .env）

# ── 图片规格 ──
image_spec:
  cover_ratio: "2.35:1"    # 封面比例（16:9 生成后中心裁）
  cover_approx: "900x383"
  inline_ratio: "16:9"     # 内文配图
  inline_approx: "900x506"
  quality: 85              # jpg 质量
