name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 1. 全历史 secret 扫描
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. 仓库结构校验（链接 / 引用 / secret / frontmatter）
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 仓库校验
        run: python scripts/validate_repo.py

  # 3. 脚本语法检查 + 质检门冒烟测试
  script-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python 语法检查
        run: |
          python -m py_compile scripts/validate_repo.py
          python -m py_compile scripts/ai_flavor_score.py
          python -m py_compile scripts/check_image_prompt.py
          python -m py_compile scripts/md2wechat.py
          python -m py_compile scripts/validate_gzh_html.py
          python -m py_compile skills/gzh-design/scripts/validate_gzh_html.py
          python -m py_compile scripts/crop_image.py
          python -m py_compile scripts/generate_image.py
          python -m py_compile scripts/image_batch.py
          python -m py_compile scripts/learned_edits.py
          python -m py_compile scripts/publish_draft.py
      - name: 生图预算层冒烟（plan-only 不调接口、不需 key）
        run: |
          cp config/workflow.example.yaml config/workflow.yaml
          python scripts/image_batch.py --manifest examples/image-manifest.example.json --plan-only > /dev/null
      - name: 生图预算层冒烟（超张数上限必须报错，退出码 3）
        run: |
          ! python scripts/image_batch.py --manifest examples/image-manifest.example.json --plan-only --max-images 1 > /dev/null
      - name: 生图预算层冒烟（统一色板要注入 prompt）
        run: |
          rm -rf generated
          python scripts/image_batch.py --manifest examples/image-manifest.example.json --prompts-only > /dev/null
          grep -q "统一色板" generated/cover_raw.png.prompt.txt
          grep -q "#3A4A5A" generated/cover_raw.png.prompt.txt
      - name: 生图预算层冒烟（非法色板必须报错，退出码 2）
        run: |
          printf '{"palette":["红色"],"images":[{"role":"cover","prompt":"p","output":"/tmp/x.png"}]}' > /tmp/badpal.json
          ! python scripts/image_batch.py --manifest /tmp/badpal.json --plan-only > /dev/null
      - name: 去 AI 味机器门冒烟（干净文本通过）
        run: |
          python scripts/ai_flavor_score.py --text "这是一个普通的句子，没有破折号也没有黑话。" > /dev/null
      - name: 去 AI 味机器门冒烟（模型路标必须失败）
        run: |
          ! python scripts/ai_flavor_score.py --text "总的来说，这件事值得注意。" > /dev/null
      - name: 去 AI 味机器门冒烟（冒号不再误杀正常中文）
        run: |
          python scripts/ai_flavor_score.py --text "时间：2024年秋天。结论：这件事没法两全。" > /dev/null
      - name: 配图 prompt 质检门冒烟（PASS 态）
        run: |
          echo "cold-pressed paper, brush stroke, 晕染, 16:9" | python scripts/check_image_prompt.py > /dev/null
      - name: HTML 校验冒烟（合规 HTML 通过）
        run: |
          printf '<section><p><span leaf="">你好</span></p></section>' | python scripts/validate_gzh_html.py --stdin
      - name: HTML 校验冒烟（class 红线必须失败）
        run: |
          ! printf '<section class="x"><p><span leaf="">你好</span></p></section>' | python scripts/validate_gzh_html.py --stdin
      - name: HTML 校验冒烟（交叉嵌套必须失败）
        run: |
          ! printf '<section><p><span leaf="">你好</span></section></p>' | python scripts/validate_gzh_html.py --stdin
      - name: HTML 校验冒烟（style 属性被截断必须失败）
        run: |
          ! printf '<section style="border-left:4px solid "#111"  # 注释"><p><span leaf="">你好</span></p></section>' | python scripts/validate_gzh_html.py --stdin
      - name: 排版增强冒烟（--enhance 产物必须 0 ERROR）
        run: |
          python scripts/md2wechat.py skills/gzh-design/assets/sample-article.md --theme red-white --enhance --underline "能力商品" --author "测试作者" -o /tmp/enhanced.html
          python scripts/validate_gzh_html.py /tmp/enhanced.html
      - name: 全主题冒烟（每套主题都要能渲染且 0 ERROR）
        run: |
          for t in examples/themes/*.yaml; do
            n=$(basename "$t" .yaml)
            python scripts/md2wechat.py skills/gzh-design/assets/sample-article.md --theme "$n" --enhance --author "测试作者" -o "/tmp/theme-$n.html"
            python scripts/validate_gzh_html.py "/tmp/theme-$n.html"
          done
      - name: 手改学习冒烟（有改动 → 记录并退出 0）
        run: |
          printf 'a\nb\nc\n' > /tmp/before.md
          printf 'a\nc\n' > /tmp/after.md
          python scripts/learned_edits.py --before /tmp/before.md --after /tmp/after.md --kind deai --append /tmp/le.md
          grep -q "改动量" /tmp/le.md
      - name: 手改学习冒烟（两版一致 → 退出 4，不写盘）
        run: |
          cp /tmp/before.md /tmp/same.md
          ! python scripts/learned_edits.py --before /tmp/before.md --after /tmp/same.md
